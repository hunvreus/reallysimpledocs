name: Release

# Publishing a GitHub release (not a prerelease):
#   1. publish: checks the tag is on main and matches package.json, then stages the
#      tagged version on npm with `npm stage publish`, using trusted publishing (OIDC,
#      no token). A maintainer then approves it on npmjs.com (Staged
#      Packages tab) or with `npm stage approve <stage-id>`, with 2FA. Until then the
#      version is not installable.
#   2. deploy-site: waits until the version is published on npm (the maintainer has
#      approved it), checking the public registry every 30 seconds for up to about 6
#      hours. Then it points the `release` branch at the tag, and Cloudflare Workers
#      Builds deploys the site from `release`. If the version was already on npm, it
#      deploys right away. If the wait times out, approve the staged version, then
#      re-run the failed deploy-site job from the workflow run page.
#
# Running this workflow manually only moves `release` to the given tag (redeploy or
# roll back the site). It never publishes to npm.
#
# npm trusted publisher settings (allow `npm stage publish` only): repository hunvreus/reallysimpledocs, workflow release.yml,
# no environment. Renaming this file breaks publishing.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to deploy to the site (for example 1.0.14). Does not publish to npm.
        required: true
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.release.prerelease == false
    permissions:
      contents: read
      id-token: write
    outputs:
      name: ${{ steps.version.outputs.name }}
      version: ${{ steps.version.outputs.version }}
      published: ${{ steps.npm.outputs.published }}
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          persist-credentials: false
          fetch-depth: 0

      - name: Check the tag is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "::error::Tag $TAG is not on main. Release from a commit on main."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # No dependency cache in a publishing job (cache poisoning).
          package-manager-cache: false

      - name: Ensure npm supports staged publishing (>= 11.15.0)
        run: |
          if ! node -e 'const [a,b]=process.argv[1].split(".").map(Number);process.exit(a>11||(a===11&&b>=15)?0:1)' "$(npm --version)"; then
            npm install -g npm@^11.15.0
          fi
          npm --version

      - name: Check package.json version matches the tag
        id: version
        run: |
          NAME=$(node -p 'require("./package.json").name')
          VERSION=$(node -p 'require("./package.json").version')
          if [ "$VERSION" != "${TAG#v}" ]; then
            echo "::error::package.json version is $VERSION but the release tag is $TAG. Bump package.json and tag that commit."
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already on npm
        id: npm
        env:
          NAME: ${{ steps.version.outputs.name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/$NAME/$VERSION")
          case "$STATUS" in
            200)
              echo "::notice::$NAME@$VERSION is already on npm. Skipping publish."
              echo "published=true" >> "$GITHUB_OUTPUT" ;;
            404)
              echo "published=false" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::Unexpected HTTP $STATUS from the npm registry."
              exit 1 ;;
          esac

      - name: Install dependencies
        if: steps.npm.outputs.published == 'false'
        run: npm ci

      - name: Run checks
        if: steps.npm.outputs.published == 'false'
        run: npm run check

      # Short-lived OIDC tokens cannot run `npm stage list`, so an already-staged version
      # is detected from the registry's conflict error instead: staged and published
      # versions share one version index, so re-staging the same version is refused.
      - name: Stage on npm
        if: steps.npm.outputs.published == 'false'
        run: |
          set +e
          npm stage publish --provenance 2>&1 | tee "$RUNNER_TEMP/stage.log"
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -eq 0 ]; then
            echo "::notice::Staged. Approve it on npmjs.com (Staged Packages tab) or with npm stage approve, using 2FA."
          elif grep -Eqi 'E409|EPUBLISHCONFLICT|previously published|already (been )?(staged|published|exists)|cannot (publish|stage) over' "$RUNNER_TEMP/stage.log"; then
            echo "::notice::This version is already staged or published on npm. Skipping."
          else
            exit "$STATUS"
          fi

  deploy-site:
    runs-on: ubuntu-latest
    needs: publish
    if: >-
      always() &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped') &&
      (github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false)
    # Covers the wait for npm approval below. 360 minutes is the GitHub-hosted maximum.
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      # Skipped when the version was already on npm before this run, and on manual runs,
      # which redeploy a tag that has already shipped.
      - name: Wait for the version to be published on npm
        if: github.event_name == 'release' && needs.publish.outputs.published != 'true'
        env:
          NAME: ${{ needs.publish.outputs.name }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          # Stop polling a little before the job timeout so the error below is shown.
          DEADLINE=$(( $(date +%s) + 355 * 60 ))
          echo "Waiting for $NAME@$VERSION on npm. Approve the staged version on npmjs.com."
          until [ "$(npm view "$NAME@$VERSION" version --prefer-online 2>/dev/null)" = "$VERSION" ]; do
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "::error::$NAME@$VERSION is still not published on npm. Approve the staged version on npmjs.com (Staged Packages tab) or with npm stage approve, then re-run the failed deploy-site job."
              exit 1
            fi
            sleep 30
          done
          echo "$NAME@$VERSION is published on npm."

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Point release branch at tag
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          SHA=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::Tag $TAG is not on main. Only tags on main can go live."
            exit 1
          fi
          git push --force origin "$SHA:refs/heads/release"
